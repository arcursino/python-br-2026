# =============================================================================
#  pyproject.toml — pybr2026-drift
#  Backend: hatchling (já disponível no Colab via pip; não precisa instalar nada)
# =============================================================================
[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "driftkit"
version = "1.0.0"
description = "Detecção de data e concept drift com calibração por dataset sintético — PyBR 2026"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ariana Cursino", email = "arcursino@gmail.com" }]
keywords = ["drift", "mlops", "monitoring", "manufacturing"]

# --- Faixas largas de propósito: o Colab troca de versão sem avisar. ---------
# Fixar "==" aqui é a receita para o tutorial quebrar na véspera do evento.
dependencies = [
    "numpy>=1.26,<2.3"",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyarrow>=14",
    "typer>=0.12",
    "fsspec>=2024.2",   # habilita pd.read_parquet("https://...")
    "requests>=2.31",   # backend http do fsspec
]

# =============================================================================
#  EXTRAS — organizados por RISCO DE QUEBRA, não por tema.
#
#  Lição aprendida na véspera: um único pacote opcional com metadata ruim
#  derruba `pip install -e ".[dev,mercado]"` inteiro, e o tutorial não abre.
#  A separação abaixo existe para que o setup instale em CAMADAS e siga
#  em frente quando uma camada opcional falha.
# =============================================================================
[project.optional-dependencies]

# --- obrigatório: sem isto os notebooks não rodam ---------------------------
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ipytest>=0.14",
    "ruff>=0.6",
]

# --- desejável: wheels puras, instalam em qualquer Python 3.10–3.13 ---------
# `river` traz extensões Cython, mas publica wheels para cp310–cp313.
mercado = [
    "river>=0.21",
]

# --- opcional: sdist grande, resolução lenta, quebra com facilidade --------
# O evidently empacota um frontend e a resolução de metadata é pesada.
# Vale para a validação cruzada do Bloco II-A, mas NÃO é pré-requisito.
mercado-evidently = [
    "evidently>=0.4",
]

# --- frágil: NÃO instale em sala. Documentado, não executado. --------------
# alibi-detect >=0.12 arrasta TensorFlow/PyTorch com pins antigos e falha a
# geração de metadata em Python 3.12+ ("Preparing metadata did not run
# successfully"). Use um venv dedicado com Python 3.11 se quiser explorar.
mercado-alibi = [
    "alibi-detect>=0.12",
]

# --- conveniência para quem roda local e quer tudo --------------------------
tudo = [
    "driftkit[dev,mercado,mercado-evidently]",
]

[project.scripts]
driftkit = "driftkit.cli:app"

[project.urls]
Repositorio = "https://github.com/SEU_USUARIO/pybr2026-drift"

[tool.hatch.build.targets.wheel]
packages = ["src/driftkit"]

# =============================================================================
#  pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "lento: leva mais de 5s (desative com -m 'not lento')",
    "requer_bosch: precisa dos parquets do Bosch em data/",
    "mercado: precisa de river/evidently (extras opcionais)",
]
filterwarnings = [
    "error::DeprecationWarning:driftkit.*",   # nosso código não deprecia em silêncio
    "default",                                # o resto: mostra, não esconde
]

# =============================================================================
#  ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PD"]
ignore = [
    "PD901",  # 'df' como nome é aceitável em código didático
    "B008",   # typer usa chamada em default de argumento por design
    "E501",   # linha longa em docstring explicativa
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["T201"]
